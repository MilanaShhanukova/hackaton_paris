<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Call Relay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 420px);
      background: #131313;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 40px 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand p {
      font-size: 13px;
      color: #555;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.3px;
    }
    label .req {
      color: #e05a5a;
      margin-left: 2px;
    }
    label .opt {
      color: #444;
      font-weight: 400;
      margin-left: 4px;
    }

    input {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      color: #e8e8e8;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    input::placeholder { color: #3a3a3a; }
    input:focus {
      border-color: #3a5a8a;
      box-shadow: 0 0 0 3px rgba(58, 90, 138, 0.18);
    }
    input.error { border-color: #8a3a3a; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .err-msg {
      font-size: 12px;
      color: #e05a5a;
      min-height: 16px;
    }

    button[type="submit"] {
      background: #2a4a7a;
      color: #c8dcf4;
      border: 1px solid #3a5a8a;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    button[type="submit"]:hover { background: #30538a; }

    .footer {
      font-size: 11px;
      color: #333;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Welcome to Call Relay</h1>
      <p>Enter your details to get started</p>
    </div>

    <form class="fields" id="form" novalidate>
      <div class="row-2">
        <div class="field">
          <label for="name">Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" placeholder="Alex Martin" value="Alex Martin" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="age">Age <span class="opt">(optional)</span></label>
          <input id="age" name="age" type="number" min="1" max="120" placeholder="28" value="28">
        </div>
      </div>

      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" placeholder="alex.martin@email.com" value="alex.martin@email.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="location">Location <span class="opt">(optional)</span></label>
        <input id="location" name="location" type="text" placeholder="Paris, France" value="Paris, France" autocomplete="address-level2">
      </div>

      <p class="err-msg" id="err"></p>

      <button type="submit">Continue →</button>
    </form>

    <p class="footer">Your information is only used within this session.</p>
  </div>

  <script>
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const age = document.getElementById("age").value.trim();
      const location = document.getElementById("location").value.trim();
      const errEl = document.getElementById("err");

      document.getElementById("name").classList.remove("error");
      document.getElementById("email").classList.remove("error");
      errEl.textContent = "";

      if (!name) {
        document.getElementById("name").classList.add("error");
        errEl.textContent = "Name is required.";
        return;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("email").classList.add("error");
        errEl.textContent = "A valid email address is required.";
        return;
      }

      localStorage.setItem("userProfile", JSON.stringify({ name, email, age, location }));
      window.location.href = "/iphone";
    });
  </script>
</body>
</html>
