<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Relay — Operator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
    }
    header { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 16px; font-weight: 600; color: #ccc; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; transition: background 0.3s;
    }
    .dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf5066; }
    .dot.speaking  { background: #2196f3; box-shadow: 0 0 6px #2196f366; }
    #status-text { font-size: 12px; color: #555; margin-left: auto; }

    #transcript {
      flex: 1;
      background: #161616;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 24px;
      font-size: 26px;
      line-height: 1.5;
      overflow-y: auto;
      color: #ddd;
      word-break: break-word;
    }
    #transcript.empty   { color: #333; font-style: italic; font-size: 18px; }
    #transcript .interim-word { color: #555; }

    #history {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      max-height: 72px;
      overflow-y: auto;
      display: none;
    }

    .reply-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      background: #1a1a1a;
      color: #e8e8e8;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.4;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #444; }
    textarea::placeholder { color: #3a3a3a; }
    button {
      background: #222;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    button:hover { background: #2a2a2a; }
    .hint { font-size: 11px; color: #333; text-align: right; }

    #call-link {
      font-size: 12px;
      color: #444;
      background: #161616;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #call-link span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #call-link button {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="dot"></div>
    <h1>Call Relay</h1>
    <span id="status-text">waiting for caller</span>
  </header>

  <div id="call-link">
    <span id="link-text">Share this link with the caller:</span>
    <button onclick="copyLink()">Copy link</button>
  </div>

  <div id="transcript" class="empty">Caller's words will appear here…</div>
  <div id="history"></div>

  <div class="reply-row">
    <textarea id="reply" rows="2" placeholder="Type your reply and press Enter…"></textarea>
    <button id="send-btn">Send ↵</button>
  </div>
  <p class="hint">Enter → send &nbsp;·&nbsp; Shift+Enter → new line</p>

  <script>
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const transcriptEl = document.getElementById("transcript");
    const historyEl = document.getElementById("history");
    const replyEl = document.getElementById("reply");
    const linkEl = document.getElementById("link-text");

    const callerUrl = `${location.protocol}//${location.host}/call`;
    linkEl.textContent = callerUrl;

    function copyLink() {
      navigator.clipboard.writeText(callerUrl);
    }

    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderTranscript(full, interim) {
      if (!full && !interim) {
        transcriptEl.className = "empty";
        transcriptEl.innerHTML = "Caller's words will appear here…";
        return;
      }
      transcriptEl.className = "";
      const sep = full && interim ? " " : "";
      transcriptEl.innerHTML =
        esc(full) + sep +
        (interim ? `<span class="interim-word">${esc(interim)}</span>` : "");
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    let fullTranscript = "";

    const ws = new WebSocket(`ws://${location.host}/ui`);
    ws.onopen = () => setStatus("ready", false);
    ws.onclose = () => setStatus("disconnected", false);

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);

      if (msg.type === "transcript") {
        if (msg.final) {
          fullTranscript = msg.full;
          renderTranscript(fullTranscript, "");
        } else {
          renderTranscript(fullTranscript, msg.text);
        }
      }

      if (msg.type === "status") {
        if (msg.text === "caller_connected") setStatus("on call", true);
        else if (msg.text === "speaking")    setStatus("speaking…", true, true);
        else if (msg.text === "caller_disconnected") {
          setStatus("waiting for caller", false);
          fullTranscript = "";
          renderTranscript("", "");
        }
      }
    };

    function setStatus(text, active, speaking = false) {
      statusText.textContent = text;
      dot.className = "dot" + (speaking ? " speaking" : active ? " connected" : "");
    }

    function send() {
      const text = replyEl.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "speak", text }));

      const line = document.createElement("div");
      line.textContent = "You: " + text;
      historyEl.appendChild(line);
      historyEl.style.display = "block";
      historyEl.scrollTop = historyEl.scrollHeight;

      replyEl.value = "";
    }

    document.getElementById("send-btn").onclick = send;
    replyEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
