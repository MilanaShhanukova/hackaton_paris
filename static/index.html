<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Relay — Operator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
    }

    header { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 16px; font-weight: 600; color: #ccc; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; transition: background 0.3s;
    }
    .dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf5066; }
    .dot.speaking  { background: #2196f3; box-shadow: 0 0 6px #2196f366; }
    #status-text { font-size: 12px; color: #555; margin-left: auto; }

    #call-link {
      font-size: 12px; color: #444;
      background: #161616; border: 1px solid #222; border-radius: 8px;
      padding: 8px 12px; display: flex; align-items: center; gap: 8px;
    }
    #call-link span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #call-link button { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

    /* ── Conversation ── */
    #conversation {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 18px;
      line-height: 1.45;
      word-break: break-word;
    }

    /* caller bubbles — left, grey */
    .bubble.caller {
      align-self: flex-start;
      background: #1e1e1e;
      color: #ddd;
      border-bottom-left-radius: 4px;
    }
    .bubble.caller.interim {
      color: #666;
      background: #191919;
    }

    /* your replies — right, blue-tinted */
    .bubble.you {
      align-self: flex-end;
      background: #1a2a3a;
      color: #9dc8f0;
      border-bottom-right-radius: 4px;
      font-size: 16px;
    }

    .empty-hint {
      color: #333; font-style: italic; font-size: 15px;
      text-align: center; margin-top: 40px;
    }

    /* ── Reply input ── */
    .reply-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      background: #1a1a1a; color: #e8e8e8;
      border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 14px 16px; font-size: 16px; line-height: 1.4;
      resize: none; outline: none; font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #444; }
    textarea::placeholder { color: #3a3a3a; }
    button {
      background: #222; color: #ccc;
      border: 1px solid #333; border-radius: 12px;
      padding: 14px 18px; font-size: 14px;
      font-family: inherit; cursor: pointer;
      white-space: nowrap; transition: background 0.15s;
    }
    button:hover { background: #2a2a2a; }
    button.ai-on {
      background: #1a2f1a; color: #6fcf6f;
      border-color: #2a4a2a;
    }
    button.ai-on:hover { background: #1e361e; }
    .hint { font-size: 11px; color: #333; text-align: right; }

    /* ── Voice panel ── */
    #voice-panel {
      display: flex; align-items: center; gap: 8px;
      background: #161616; border: 1px solid #222; border-radius: 8px;
      padding: 8px 12px; font-size: 12px;
    }
    #voice-panel label { color: #555; white-space: nowrap; }
    #voice-select {
      flex: 1; background: #1a1a1a; color: #ccc;
      border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 4px 8px; font-size: 12px; font-family: inherit;
      outline: none; cursor: pointer;
    }
    #clone-toggle {
      padding: 4px 10px; font-size: 11px; border-radius: 6px;
      white-space: nowrap;
    }
    #clone-panel {
      display: none;
      background: #161616; border: 1px solid #222; border-radius: 8px;
      padding: 10px 12px; font-size: 12px;
      gap: 8px; flex-direction: column;
    }
    #clone-panel.open { display: flex; }
    .clone-row { display: flex; gap: 8px; align-items: center; }
    #voice-name-input {
      flex: 1; background: #1a1a1a; color: #ccc;
      border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none;
    }
    #voice-file { font-size: 11px; color: #555; flex: 1; }
    #clone-status { font-size: 11px; color: #555; }
    
    
    /* AI reply bubbles — right, green-tinted */
    .bubble.ai {
      align-self: flex-end;
      background: #1a2f1a;
      color: #6fcf6f;
      border-bottom-right-radius: 4px;
      font-size: 16px;
    }
    .bubble.ai::before {
      content: "AI  ";
      font-size: 11px;
      opacity: 0.6;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="dot"></div>
    <h1>Call Relay</h1>
    <span id="status-text">waiting for caller</span>
  </header>

  <div id="voice-panel">
    <label>Voice:</label>
    <select id="voice-select"><option value="">Loading…</option></select>
    <button id="clone-toggle" onclick="toggleClone()">+ Clone my voice</button>
  </div>

  <div id="clone-panel">
    <div class="clone-row">
      <input type="file" id="voice-file" accept="audio/*">
      <input type="text" id="voice-name-input" placeholder="Voice name" value="My Voice">
      <button onclick="uploadVoice()">Upload</button>
    </div>
    <span id="clone-status"></span>
  </div>

  <div id="call-link">
    <span id="link-text"></span>
    <button onclick="copyLink()">Copy link</button>
  </div>

  <div id="conversation">
    <p class="empty-hint">Conversation will appear here…</p>
  </div>

  <div class="reply-row">
    <textarea id="reply" rows="2" placeholder="Type your reply and press Enter…"></textarea>
    <button id="ai-btn" title="Toggle AI auto-reply mode">AI</button>
    <button id="send-btn">Send ↵</button>
  </div>
  <p class="hint">Enter → send &nbsp;·&nbsp; Shift+Enter → new line &nbsp;·&nbsp; AI button → auto-reply mode</p>

  <script>
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const conv = document.getElementById("conversation");
    const replyEl = document.getElementById("reply");
    const linkEl = document.getElementById("link-text");
    const aiBtnEl = document.getElementById("ai-btn");

    const callerUrl = `${location.protocol}//${location.host}/type`;
    linkEl.textContent = "Share with the other person: " + callerUrl;
    function copyLink() { navigator.clipboard.writeText(callerUrl); }

    // ── Voice management ──────────────────────────────────────────────────
    const voiceSelect = document.getElementById("voice-select");

    async function loadVoices() {
      try {
        const [voicesRes, currentRes] = await Promise.all([
          fetch("/voices"), fetch("/voice-id"),
        ]);
        if (!voicesRes.ok) throw new Error(`/voices returned ${voicesRes.status}`);
        const voices = await voicesRes.json();
        const { voice_id: currentId } = await currentRes.json();

        voiceSelect.innerHTML = "";

        // Custom cloned voices first, then catalog sorted by name
        const sorted = [
          ...voices.filter(v => !v.is_catalog),
          ...voices.filter(v => v.is_catalog).sort((a, b) => a.name.localeCompare(b.name)),
        ].filter(v => v.name);

        sorted.forEach(v => {
          const opt = document.createElement("option");
          opt.value = v.uid;
          opt.textContent = v.is_catalog ? v.name : `★ ${v.name}`;
          if (v.uid === currentId) opt.selected = true;
          voiceSelect.appendChild(opt);
        });

        if (!voiceSelect.options.length)
          voiceSelect.innerHTML = '<option value="">No voices found</option>';
      } catch (err) {
        voiceSelect.innerHTML = `<option value="">Error loading voices</option>`;
        console.error("loadVoices failed:", err);
      }
    }

    voiceSelect.addEventListener("change", () => {
      if (ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: "set_voice", voice_id: voiceSelect.value }));
    });

    function toggleClone() {
      document.getElementById("clone-panel").classList.toggle("open");
    }

    async function uploadVoice() {
      const file = document.getElementById("voice-file").files[0];
      if (!file) return;
      const name = document.getElementById("voice-name-input").value.trim() || file.name;
      const status = document.getElementById("clone-status");
      status.textContent = "Uploading…";
      try {
        const form = new FormData();
        form.append("file", file);
        form.append("name", name);
        const res = await fetch("/clone-voice", { method: "POST", body: form });
        if (!res.ok) throw new Error(await res.text());
        const voice = await res.json();
        status.textContent = `✓ Cloned "${voice.name}"`;
        await loadVoices();
        voiceSelect.value = voice.uid;
        if (ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: "set_voice", voice_id: voice.uid }));
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    loadVoices();

    // The live interim bubble (replaced until finalized)
    let interimBubble = null;

    function addCallerBubble(msg) {
      if (!interimBubble) {
        conv.querySelector(".empty-hint")?.remove();
        interimBubble = document.createElement("div");
        interimBubble.className = "bubble caller interim";
        conv.appendChild(interimBubble);
      }
      interimBubble.textContent = msg.text;  // server sends full growing sentence
      if (msg.final) {
        interimBubble.className = "bubble caller";
        interimBubble = null;  // next sentence gets a fresh bubble
      }
      conv.scrollTop = conv.scrollHeight;
    }

    function addYourBubble(text) {
      conv.querySelector(".empty-hint")?.remove();
      const b = document.createElement("div");
      b.className = "bubble you";
      b.textContent = text;
      conv.appendChild(b);
      conv.scrollTop = conv.scrollHeight;
    }

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ui`);
    ws.onopen = () => setStatus("ready", false);
    ws.onclose = () => setStatus("disconnected", false);

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);

      if (msg.type === "transcript") {
        addCallerBubble(msg);
      }

      if (msg.type === "status") {
        if (msg.text === "caller_connected")    setStatus("on call", true);
        else if (msg.text === "speaking")        setStatus("speaking…", true, true);
        else if (msg.text === "caller_disconnected") setStatus("waiting for caller", false);
      }
    };

    function setStatus(text, active, speaking = false) {
      statusText.textContent = text;
      dot.className = "dot" + (speaking ? " speaking" : active ? " connected" : "");
    }

    // Track how many complete words (word + space) we've already sent to TTS
    let wordsSent = 0;

    replyEl.addEventListener("input", () => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const text = replyEl.value;
      // Match words that are followed by whitespace (i.e., completed words)
      const completeWords = text.match(/\S+(?=\s)/g) || [];
      while (wordsSent < completeWords.length) {
        ws.send(JSON.stringify({ type: "stream_word", word: completeWords[wordsSent] }));
        wordsSent++;
      }
    });

    function send() {
      const text = replyEl.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;

      // Send any final word that hasn't been streamed yet (no trailing space)
      const allWords = text.split(/\s+/).filter(Boolean);
      while (wordsSent < allWords.length) {
        ws.send(JSON.stringify({ type: "stream_word", word: allWords[wordsSent] }));
        wordsSent++;
      }

      // Signal TTS to flush and close
      ws.send(JSON.stringify({ type: "stream_done" }));

      addYourBubble(text);
      replyEl.value = "";
      wordsSent = 0;
    }

    replyEl.addEventListener("focus", () => {
      if (ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: "tts_warmup" }));
    });

    document.getElementById("send-btn").onclick = send;
    aiBtnEl.onclick = () => ws.send(JSON.stringify({ type: "toggle_ai" }));
    replyEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
