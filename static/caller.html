<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 500; color: #aaa; }
    #btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      font-size: 40px;
      cursor: pointer;
      background: #1e1e1e;
      transition: background 0.2s, transform 0.1s;
    }
    #btn:hover { background: #2a2a2a; }
    #btn.active { background: #1a3a1a; animation: pulse 1.5s infinite; }
    #btn:active { transform: scale(0.95); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 #4caf5044; }
      50%       { box-shadow: 0 0 0 16px #4caf5000; }
    }
    #status { font-size: 14px; color: #555; min-height: 20px; }
    #status.on  { color: #4caf50; }
    #status.err { color: #f44336; }
  </style>
</head>
<body>
  <h1>Tap to talk</h1>
  <button id="btn">🎙️</button>
  <p id="status">Press to start</p>

  <script>
    const SAMPLE_RATE = 16000;
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    let context, ws, node, stream;
    let active = false;

    btn.onclick = active ? hangUp : startCall;

    async function startCall() {
      try {
        setStatus("Connecting…", "");
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        context = new AudioContext({ sampleRate: SAMPLE_RATE });
        await context.audioWorklet.addModule("/static/audio-processor.js");

        const protocol = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${location.host}/caller-stream`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          const source = context.createMediaStreamSource(stream);
          node = new AudioWorkletNode(context, "pcm-processor");

          // mic → server
          node.port.onmessage = (e) => {
            if (ws.readyState === WebSocket.OPEN) ws.send(e.data);
          };
          source.connect(node);

          active = true;
          btn.textContent = "⏹️";
          btn.classList.add("active");
          setStatus("On call", "on");
        };

        // server → TTS playback
        let nextPlayTime = 0;
        ws.onmessage = (e) => {
          if (!(e.data instanceof ArrayBuffer)) return;
          const int16 = new Int16Array(e.data);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

          const buf = context.createBuffer(1, float32.length, SAMPLE_RATE);
          buf.copyToChannel(float32, 0);

          const src = context.createBufferSource();
          src.buffer = buf;
          src.connect(context.destination);

          // schedule back-to-back so chunks play seamlessly
          const now = context.currentTime;
          if (nextPlayTime < now) nextPlayTime = now + 0.05;
          src.start(nextPlayTime);
          nextPlayTime += buf.duration;
        };

        ws.onclose = () => hangUp();
        ws.onerror = () => setStatus("Connection error", "err");

      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    function hangUp() {
      active = false;
      btn.textContent = "🎙️";
      btn.classList.remove("active");
      setStatus("Call ended", "");
      node?.disconnect();
      stream?.getTracks().forEach(t => t.stop());
      ws?.close();
      context?.close();
    }

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls;
    }

    btn.onclick = () => active ? hangUp() : startCall();
  </script>
</body>
</html>
